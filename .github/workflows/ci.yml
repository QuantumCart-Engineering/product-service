name: Product Service CI

on:
  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - uat
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: quantumcart_products_test
          MYSQL_USER: quantumcart
          MYSQL_PASSWORD: test_database_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s

    env:
      NODE_ENV: test
      PORT: 8002

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: quantumcart
      DB_PASSWORD: test_database_password
      DB_NAME: quantumcart_products_test
      DB_CONNECTION_LIMIT: 10

      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: test_root_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run test coverage
        run: npm run test:coverage

      - name: Build Docker image
        run: docker build -t quantumcart-product-service:ci .