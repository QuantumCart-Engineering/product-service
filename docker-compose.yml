services:
  mysql:
    image: mysql:8.4
    container_name: quantumcart-product-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - product_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_ROOT_USER}",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - quantumcart-network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: quantumcart-product-service

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8002

      # CORS (comma separated). Defaults to the local storefront origin so a
      # browser request never gets rejected by the downstream service.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT}

      DB_ROOT_USER: ${DB_ROOT_USER}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "8002:8002"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - quantumcart-network

networks:
  quantumcart-network:
    external: true

volumes:
  product_mysql_data: